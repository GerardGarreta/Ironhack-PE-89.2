version: '3.8'

services:
  alice:
    image: python:3.11-slim
    container_name: alice
    hostname: alice
    working_dir: /app
    volumes:
      - ./scripts:/app
    networks:
      red-cripto:
        ipv4_address: 172.28.0.20
    tty: true
    stdin_open: true
    restart: always

  bob:
    image: python:3.11-slim
    container_name: bob
    hostname: bob
    working_dir: /app
    volumes:
      - ./scripts:/app
    networks:
      red-cripto:
        ipv4_address: 172.28.0.10
    tty: true
    stdin_open: true
    restart: always

networks:
  red-cripto:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
